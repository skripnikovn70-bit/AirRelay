name: Build AirRelay APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'air_relay.html'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project structure
        run: |
          mkdir -p app/src/main/java/com/airrelay/vpn
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/res/values

          # Копируем HTML-интерфейс в assets
          cp air_relay.html app/src/main/assets/air_relay.html

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AirRelay"
          include(":app")
          EOF

          # gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          # Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.airrelay.vpn"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.airrelay.vpn"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk {
                      abiFilters += listOf("arm64-v8a")
                  }
              }

              buildTypes {
                  debug {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          # styles.xml (полноэкранный режим без системной шапки)
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.AirRelay" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowTranslucentStatus">false</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowBackground">#05070D</item>
              </style>
          </resources>
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:extractNativeLibs="true"
                  android:label="AirRelay"
                  android:theme="@style/Theme.AirRelay"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AirRelayVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:foregroundServiceType="specialUse">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="vpn" />
                  </service>
              </application>
          </manifest>
          EOF

          # MainActivity.kt (WebView + мост window.AndroidVPN)
          cat << 'EOF' > app/src/main/java/com/airrelay/vpn/MainActivity.kt
          package com.airrelay.vpn

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.net.VpnService
          import android.os.Build
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView
              private var pendingConfig: String? = null
              private val VPN_REQUEST_CODE = 1001

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WindowCompat.setDecorFitsSystemWindows(window, false)

                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                  }
                  webView.setBackgroundColor(0x00000000)
                  webView.webViewClient = WebViewClient()
                  webView.addJavascriptInterface(VpnBridge(), "AndroidVPN")
                  webView.loadUrl("file:///android_asset/air_relay.html")
              }

              inner class VpnBridge {
                  @JavascriptInterface
                  fun startVpn(configJson: String) {
                      runOnUiThread {
                          pendingConfig = configJson
                          val intent = VpnService.prepare(this@MainActivity)
                          if (intent != null) {
                              startActivityForResult(intent, VPN_REQUEST_CODE)
                          } else {
                              launchVpnService(configJson)
                          }
                      }
                  }

                  @JavascriptInterface
                  fun stopVpn() {
                      runOnUiThread {
                          val intent = Intent(this@MainActivity, AirRelayVpnService::class.java).apply {
                              action = AirRelayVpnService.ACTION_STOP
                          }
                          startService(intent)
                      }
                  }
              }

              private fun launchVpnService(configJson: String) {
                  val intent = Intent(this, AirRelayVpnService::class.java).apply {
                      action = AirRelayVpnService.ACTION_START
                      putExtra(AirRelayVpnService.EXTRA_CONFIG, configJson)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == VPN_REQUEST_CODE && resultCode == Activity.RESULT_OK) {
                      pendingConfig?.let { launchVpnService(it) }
                  }
              }
          }
          EOF

          # AirRelayVpnService.kt (VpnService + запуск ядра sing-box)
          cat << 'EOF' > app/src/main/java/com/airrelay/vpn/AirRelayVpnService.kt
          package com.airrelay.vpn

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Intent
          import android.net.VpnService
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import java.io.File

          class AirRelayVpnService : VpnService() {

              companion object {
                  const val ACTION_START = "com.airrelay.vpn.START"
                  const val ACTION_STOP = "com.airrelay.vpn.STOP"
                  const val EXTRA_CONFIG = "config_json"
                  private const val CHANNEL_ID = "airrelay_vpn_channel"
              }

              private var vpnInterface: ParcelFileDescriptor? = null
              private var coreProcess: Process? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_START -> {
                          val config = intent.getStringExtra(EXTRA_CONFIG) ?: return START_NOT_STICKY
                          startTunnel(config)
                      }
                      ACTION_STOP -> stopTunnel()
                  }
                  return START_STICKY
              }

              private fun startTunnel(configJson: String) {
                  stopTunnel()
                  startForeground(1, buildNotification())

                  val builder = Builder()
                      .setSession("AirRelay")
                      .setMtu(1500)
                      .addAddress("172.19.0.1", 30)
                      .addRoute("0.0.0.0", 0)
                      .addDnsServer("1.1.1.1")
                      .addDisallowedApplication(packageName)

                  vpnInterface = builder.establish()

                  // Сохраняем конфиг и запускаем ядро libsingbox.so
                  val configFile = File(filesDir, "config.json")
                  configFile.writeText(configJson)

                  val binPath = File(applicationInfo.nativeLibraryDir, "libsingbox.so").absolutePath
                  if (File(binPath).exists()) {
                      coreProcess = ProcessBuilder(binPath, "run", "-c", configFile.absolutePath)
                          .redirectErrorStream(true)
                          .start()
                  }
              }

              private fun stopTunnel() {
                  coreProcess?.destroy()
                  coreProcess = null
                  vpnInterface?.close()
                  vpnInterface = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              private fun buildNotification(): Notification {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID, "AirRelay VPN", NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                  } else {
                      Notification.Builder(this)
                  }
                      .setContentTitle("AirRelay")
                      .setContentText("Туннель активен")
                      .setSmallIcon(android.R.drawable.ic_lock_lock)
                      .build()
              }

              override fun onDestroy() {
                  stopTunnel()
                  super.onDestroy()
              }
          }
          EOF

      - name: Download sing-box core (android arm64)
        run: |
          VER="1.10.7"
          curl -L "https://github.com/SagerNet/sing-box/releases/download/v${VER}/sing-box-${VER}-android-arm64.tar.gz" -o singbox.tar.gz
          tar -xzf singbox.tar.gz
          cp sing-box-${VER}-android-arm64/sing-box app/src/main/jniLibs/arm64-v8a/libsingbox.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libsingbox.so

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirRelay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
